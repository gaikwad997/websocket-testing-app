<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous">
    <style>
        table {
            border: 0
        }

        td {
            padding: 5px;
        }

        .commslog-data {
            font-family: Consolas, Courier New, Courier, monospace;
        }

        .commslog-server {
            background-color: red;
            color: white
        }

        .commslog-client {
            background-color: green;
            color: white
        }
    </style>
</head>
<body>
    <div class="container" style="margin-top:10px;">

        <h3 style="display:none">WebSocket Sample Application</h3>
        <div class="form-group">
            <p id="stateLabel">Ready to connect...</p>
			<hr/>
            <table>
                <tr>
                    <td> <label for="connectionUrl">WebSocket Server URL:</label> </td>
                    <td><input id="connectionUrl" class="form-control" value="wss://tourney.salusgames.net:8023/ws" /></td>
                    <td> <button id="connectButton" type="submit" class="btn btn-sm btn-warning">Connect</button></td>
                    <td> <button id="closeButton" disabled class="btn btn-sm btn-danger">Close Socket</button></td>
                </tr>
                <tr>
                    <td> <label for="sendMessage">Message to send:</label></td>
                    <td> <input id="sendMessage" disabled class="form-control" /></td>
                    <td> <button id="sendButton" type="submit" disabled class="btn btn-sm btn-success">Send</button></td>
                </tr>
                <tr>
                    <td> <label>Command to send:</label></td>
                    <td>
                        <select id="ddCmd" class="form-control">
                            <option value="1">TABLECOUNT</option>
                            <option value="2">CURRTIME</option>
                            <option value="3">PLAYERCOUNT</option>
                            <option value="23">LOGOUT</option>
                        </select>
                    </td>
                    <td><button id="sndCmd" type="submit" class="btn btn-sm btn-success">Command</button></td>
                </tr>
            </table>
            <p></p>
			<hr/>
            <h4>Communication Log</h4>
            <div class="container" style="height:500px">
                <table style="width: 800px">
                    <thead>
                        <tr>
                            <td style="width: 100px">From</td>
                            <td style="width: 100px">To</td>
                            <td>Data</td>
                        </tr>
                    </thead>
                    <tbody id="commsLog"></tbody>
                </table>
            </div>
        </div>
    </div>


    <script>
        var connectionForm = document.getElementById("connectionForm");
        var connectionUrl = document.getElementById("connectionUrl");
        var connectButton = document.getElementById("connectButton");
        var stateLabel = document.getElementById("stateLabel");
        var sendMessage = document.getElementById("sendMessage");
        var sendButton = document.getElementById("sendButton");
        var sndCmd = document.getElementById("sndCmd");
        var sendForm = document.getElementById("sendForm");
        var commsLog = document.getElementById("commsLog");
        var socket;
        var scheme = document.location.protocol == "https:" ? "wss" : "ws";
        var port = document.location.port ? (":" + document.location.port) : "";
		var conurl = scheme + "://" + document.location.hostname + port + "/ws";
        //connectionUrl.value = scheme + "://" + document.location.hostname + port + "/ws";

        function updateState() {
            function disable() {
                sendMessage.disabled = true;
                sendButton.disabled = true;
                closeButton.disabled = true;
            }

            function enable() {
                sendMessage.disabled = false;
                sendButton.disabled = false;
                closeButton.disabled = false;
            }

            connectionUrl.disabled = true;
            connectButton.disabled = true;

            if (!socket) {
                disable();
            } else {
                switch (socket.readyState) {
                    case WebSocket.CLOSED:
                        stateLabel.innerHTML = "Closed";
                        disable();
                        connectionUrl.disabled = false;
                        connectButton.disabled = false;
                        break;
                    case WebSocket.CLOSING:
                        stateLabel.innerHTML = "Closing...";
                        disable();
                        break;
                    case WebSocket.CONNECTING:
                        stateLabel.innerHTML = "Connecting...";
                        disable();
                        break;
                    case WebSocket.OPEN:
                        stateLabel.innerHTML = "Open";
                        enable();
                        break;
                    default:
                        stateLabel.innerHTML = "Unknown WebSocket State: " + socket.readyState;
                        disable();
                        break;
                }
            }
        }

        closeButton.onclick = function () {
            if (!socket || socket.readyState != WebSocket.OPEN) {
                alert("socket not connected");
            }
            socket.close(1000, "Closing from client");
        }

        sendButton.onclick = function () {
            if (!socket || socket.readyState != WebSocket.OPEN) {
                alert("socket not connected");
            }

            var data = 'LOGIN\t' + sendMessage.value + '\tTest@123\t1\t192.168.0.15\tCAPTCH\n';
            // var data = String(sendMessage.value);
            socket.send(data);
            commsLog.innerHTML += '<tr>' +
                '<td class="commslog-client">Client</td>' +
                '<td class="commslog-server">Server</td>' +
                '<td class="commslog-data">' + data + '</td>'
            '</tr>';
            sendButton.disabled = true;
        }

        sndCmd.onclick = function () {
            if (!socket || socket.readyState != WebSocket.OPEN) {
                alert("socket not connected");
            }

            var e = document.getElementById("ddCmd");
            var value = e.value;
            var text = e.options[e.selectedIndex].text;
            socket.send(value);
            commsLog.innerHTML += '<tr>' +
                '<td class="commslog-client">Client</td>' +
                '<td class="commslog-server">Server</td>' +
                '<td class="commslog-data">' + text + '</td>'
            '</tr>';
            sendButton.disabled = true;
        }

        connectButton.onclick = function () {
            stateLabel.innerHTML = "Connecting";
            socket = new WebSocket(connectionUrl.value);
            socket.onopen = function (event) {
                updateState();
                commsLog.innerHTML += '<tr>' +
                    '<td colspan="3" class="commslog-data">Connection opened</td>' +
                    '</tr>';
            };

            socket.onclose = function (event) {
                updateState();
                commsLog.innerHTML += '<tr>' +
                    '<td colspan="3" class="commslog-data">Connection closed. Code: ' + event.code + '. Reason: ' + event.reason + '</td>' +
                    '</tr>';
            };

            socket.onerror = updateState;
            socket.onmessage = function (event) {
                commsLog.innerHTML += '<tr>' +
                    '<td class="commslog-server">Server</td>' +
                    '<td class="commslog-client">Client</td>' +
                    '<td class="commslog-data">' + event.data + '</td>'
                '</tr>';
            };
        };
    </script>
</body>
</html>
